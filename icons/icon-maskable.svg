<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#22417a"/><stop offset=".55" stop-color="#13264a"/><stop offset="1" stop-color="#0a1530"/>
    </radialGradient>
    <radialGradient id="ice" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e9f1fb"/><stop offset="1" stop-color="#b8c8de"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#dfe6ef"/><stop offset="1" stop-color="#9aa8bb"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d9aae"/><stop offset="1" stop-color="#4c586c"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe3f0"/><stop offset=".45" stop-color="#9ab8ff"/><stop offset=".75" stop-color="#f3b7e3"/><stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#030a18" flood-opacity=".6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- house rings, top-down, slightly squashed like the tilted camera -->
  <g transform="translate(256 262) scale(.78 .702)">
    <circle r="214" fill="#0b1a36" opacity=".55"/>
    <circle r="204" fill="#3b6ad8"/>
    <circle r="156" fill="url(#ice)"/>
    <circle r="110" fill="#d2354a"/>
    <circle r="62" fill="url(#ice)"/>
    <line x1="-212" y1="0" x2="212" y2="0" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
    <line x1="0" y1="-212" x2="0" y2="212" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
  </g>
  <!-- 2048 stone -->
  <g filter="url(#sh)" transform="translate(56.3 57.2) scale(.78)">
    <ellipse cx="256" cy="276" rx="88" ry="64" fill="url(#side)"/>
    <ellipse cx="256" cy="260" rx="88" ry="64" fill="url(#stone)"/>
    <ellipse cx="256" cy="260" rx="70" ry="49" fill="#0e1d3a"/>
    <ellipse cx="256" cy="260" rx="70" ry="49" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <text transform="translate(56.3 57.2) scale(.78)" x="256" y="279" text-anchor="middle" font-family="Inter" font-weight="900" font-style="italic" font-size="54" letter-spacing="-3" fill="url(#num)">2048</text>
</svg>
