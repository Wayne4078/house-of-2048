<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arin Play 테스트 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column like a paper test sheet — header strip, "play first" card, numbered question sheet, sticky send bar. */
:root{
  --bg:#EEF2F6; --sheet:#FFFFFF; --ink:#13213A; --muted:#5B6B82; --line:#D5DDE7;
  --accent:#E8553B; --accent-ink:#FFFFFF; --chip:#F4F7FA; --chip-on:#13213A; --chip-on-ink:#FFFFFF; --ok:#1F8A5B;
  --f:'Noto Sans KR','Noto Sans Thai','Apple SD Gothic Neo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --sheet:#152036; --ink:#E9EEF6; --muted:#9AA9BF; --line:#26344D;
  --accent:#FF7559; --accent-ink:#1A0B06; --chip:#1B2740; --chip-on:#E9EEF6; --chip-on-ink:#0D1524; --ok:#4CC08D; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1524; --sheet:#152036; --ink:#E9EEF6; --muted:#9AA9BF; --line:#26344D;
  --accent:#FF7559; --accent-ink:#1A0B06; --chip:#1B2740; --chip-on:#E9EEF6; --chip-on-ink:#0D1524; --ok:#4CC08D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.06em;font-size:13px;color:var(--muted);text-transform:uppercase}
.langs{display:flex;gap:6px}
.langs button{font:700 14px var(--f);padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
h1{font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.2;margin:4px 0 0;text-wrap:balance}
.meta{color:var(--muted);font-size:15px;margin:0}
.meta b{color:var(--ink)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.play p{margin:0}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:900 18px var(--f);text-decoration:none;cursor:pointer}
.btn:focus-visible,.chips button:focus-visible,textarea:focus-visible,.langs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q label,.q .qt{font-weight:700;font-size:18px;line-height:1.4;display:flex;gap:10px}
.q .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--muted);font:700 14px/26px var(--f);text-align:center;margin-top:1px}
.q .opt{font-weight:400;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:700 16px var(--f);min-height:48px;min-width:64px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-width:0;padding:0;font-size:22px}
.scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
textarea{width:100%;min-height:84px;resize:vertical;font:400 17px/1.5 var(--f);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px}
.honest{margin:0;font-size:15px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.bar .btn{width:100%}
.bar .btn[disabled]{opacity:.55;cursor:default}
.status{min-height:1.2em;font-size:14px;text-align:center;color:var(--muted);margin:0}
.status.err{color:var(--accent)}
.done{align-items:center;text-align:center;padding-block:36px}
.done .mark{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font:900 34px/64px var(--f)}
.done h2{margin:0;font-size:24px}
.done p{margin:0;color:var(--muted)}
.privacy{color:var(--muted);font-size:13px;text-align:center;margin:0}
@media (prefers-reduced-motion:no-preference){.chips button{transition:background .12s,color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Arin Play · Playtest</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko" id="l-ko">한</button>
      <button type="button" data-lang="en" id="l-en">EN</button>
      <button type="button" data-lang="th" id="l-th">ไทย</button>
    </div>
  </header>

  <div>
    <h1 id="title"></h1>
    <p class="meta"><span data-t="tester"></span>: <b id="who"></b></p>
  </div>

  <section class="card play" id="playcard">
    <p data-t="intro"></p>
    <ul class="rules">
      <li data-t="r1"></li>
      <li data-t="r2"></li>
    </ul>
    <a class="btn" id="playlink" target="_blank" rel="noopener"><span data-t="play"></span></a>
  </section>

  <form class="card" id="form" novalidate>
    <div class="q"><span class="qt"><span class="n">1</span><span data-t="q_matches"></span></span>
      <div class="chips" data-field="matches" data-type="int">
        <button type="button" data-v="1" id="m1">1</button><button type="button" data-v="2" id="m2">2</button><button type="button" data-v="3" id="m3">3</button><button type="button" data-v="4" id="m4">4+</button>
      </div></div>
    <div class="q"><span class="qt"><span class="n">2</span><span data-t="q_knew"></span></span>
      <div class="chips" data-field="knew_what_to_do">
        <button type="button" data-v="yes" id="k-yes" data-t="yes"></button><button type="button" data-v="some" id="k-some" data-t="some"></button><button type="button" data-v="no" id="k-no" data-t="no"></button>
      </div></div>
    <div class="q"><span class="qt"><span class="n">3</span><span id="q2text"></span></span>
      <div class="chips" data-field="got_the_score">
        <button type="button" data-v="yes" id="s-yes" data-t="yes"></button><button type="button" data-v="some" id="s-some" data-t="some"></button><button type="button" data-v="no" id="s-no" data-t="no"></button>
      </div></div>
    <div class="q"><label for="best"><span class="n">4</span><span data-t="q_best"></span></label>
      <textarea id="best" maxlength="1000"></textarea></div>
    <div class="q"><label for="worst"><span class="n">5</span><span data-t="q_worst"></span></label>
      <textarea id="worst" maxlength="1000"></textarea></div>
    <div class="q"><span class="qt"><span class="n">6</span><span data-t="q_again"></span></span>
      <div class="chips scale" data-field="again" data-type="int">
        <button type="button" data-v="1" id="a1" aria-label="1">😣</button><button type="button" data-v="2" id="a2" aria-label="2">🙁</button><button type="button" data-v="3" id="a3" aria-label="3">😐</button><button type="button" data-v="4" id="a4" aria-label="4">🙂</button><button type="button" data-v="5" id="a5" aria-label="5">😍</button>
      </div>
      <div class="scale-ends"><span data-t="again_lo"></span><span data-t="again_hi"></span></div></div>
    <div class="q"><label for="change_one"><span class="n">7</span><span data-t="q_change"></span></label>
      <textarea id="change_one" maxlength="1000"></textarea></div>
    <div class="q"><span class="qt"><span class="n">8</span><span><span data-t="q_device"></span> <span class="opt" data-t="optional"></span></span></span>
      <div class="chips" data-field="device">
        <button type="button" data-v="iphone" id="d-iphone">iPhone</button><button type="button" data-v="android" id="d-android">Android</button><button type="button" data-v="ipad" id="d-ipad">iPad</button><button type="button" data-v="other" id="d-other" data-t="other"></button>
      </div></div>
    <div class="q"><label for="extra"><span class="n">9</span><span><span data-t="q_extra"></span> <span class="opt" data-t="optional"></span></span></label>
      <textarea id="extra" maxlength="1000"></textarea></div>
    <p class="honest" data-t="honest"></p>
  </form>

  <section class="card done" id="done" hidden>
    <div class="mark" aria-hidden="true">✓</div>
    <h2 data-t="done_h"></h2>
    <p data-t="done_p"></p>
  </section>

  <p class="privacy" data-t="privacy"></p>
</div>

<div class="bar" id="bar">
  <div class="inner">
    <button class="btn" type="button" id="send"><span data-t="send"></span></button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</div>

<script>
(()=>{'use strict';
const SINK={url:'https://nrcyoqajqqbuwazlrbpa.supabase.co/rest/v1/playtest_feedback',key:'sb_publishable_XSDekoMOwFTaiNcrLSvYKg_fsj-XnQs'};
/* Games under test. Add a new game here: name per language, public URL, and the game-specific question 3. */
const GAMES={
  curling2048:{name:{ko:'컬링 2048',en:'Curling 2048',th:'Curling 2048'},url:'https://curling2048.arinplay.app/',
    q2:{ko:'점수가 왜 그렇게 나왔는지 이해됐어요?',en:'Did you understand why you got the score you got?',th:'เข้าใจไหมว่าทำไมได้คะแนนเท่านั้น?'}}
};
const T={
  ko:{tester:'테스터',intro:'테스트를 도와줘서 고마워요! 먼저 게임을 3판 해주세요.',r1:'누구에게도 묻지 말고 혼자 해보세요.',r2:'다 하고 이 페이지로 돌아와서 답해주세요.',play:'게임하러 가기 →',
    q_matches:'몇 판 했어요?',q_knew:'처음에 뭘 해야 하는지 바로 알았어요?',yes:'네',some:'조금',no:'아니요',q_best:'제일 재밌었던 순간은?',q_worst:'제일 별로였거나 짜증났던 순간은?',
    q_again:'또 하고 싶어요?',again_lo:'전혀',again_hi:'완전',q_change:'딱 하나만 바꿀 수 있다면 뭘 바꿀래요?',q_device:'어떤 기기로 했어요?',other:'기타',q_extra:'더 하고 싶은 말',optional:'(선택)',
    honest:'솔직하게 써주세요. 칭찬보다 불만이 훨씬 도움이 돼요.',send:'답 보내기',sending:'보내는 중…',need:'1, 2, 3, 6번은 골라주세요.',fail:'보내지 못했어요. 인터넷을 확인하고 다시 눌러주세요.',
    done_h:'보냈어요. 고마워요!',done_p:'링크를 보내준 사람에게 다 했다고 알려주세요.',privacy:'이름 같은 개인정보는 저장하지 않아요.',again_sent:'이미 보냈어요. 다시 보내면 새 답으로 하나 더 저장돼요.'},
  en:{tester:'Tester',intro:'Thanks for helping! First, please play 3 matches.',r1:'Play on your own, without asking anyone.',r2:'Then come back to this page and answer.',play:'Play the game →',
    q_matches:'How many matches did you play?',q_knew:'Did you know what to do right away?',yes:'Yes',some:'A little',no:'No',q_best:'What was the most fun moment?',q_worst:'What was the worst or most annoying moment?',
    q_again:'Would you play again?',again_lo:'Not at all',again_hi:'Definitely',q_change:'If you could change one thing, what would it be?',q_device:'What did you play on?',other:'Other',q_extra:'Anything else?',optional:'(optional)',
    honest:'Please be honest. Complaints help us more than compliments.',send:'Send answers',sending:'Sending…',need:'Please answer questions 1, 2, 3 and 6.',fail:'Could not send. Check your connection and tap again.',
    done_h:'Sent. Thank you!',done_p:'Let the person who sent you the link know you are done.',privacy:'We do not store your name or personal details.',again_sent:'Already sent. Sending again saves a second answer.'},
  th:{tester:'ผู้ทดสอบ',intro:'ขอบคุณที่ช่วยทดสอบ! ก่อนอื่นช่วยเล่นเกม 3 รอบนะ',r1:'เล่นเองคนเดียว ไม่ต้องถามใคร',r2:'เล่นเสร็จแล้วกลับมาที่หน้านี้เพื่อตอบคำถาม',play:'ไปเล่นเกม →',
    q_matches:'เล่นไปกี่รอบ?',q_knew:'ตอนแรกรู้เลยไหมว่าต้องทำอะไร?',yes:'ใช่',some:'นิดหน่อย',no:'ไม่',q_best:'ช่วงไหนสนุกที่สุด?',q_worst:'ช่วงไหนน่าเบื่อหรือหงุดหงิดที่สุด?',
    q_again:'อยากเล่นอีกไหม?',again_lo:'ไม่เลย',again_hi:'อยากมาก',q_change:'ถ้าเปลี่ยนได้ 1 อย่าง จะเปลี่ยนอะไร?',q_device:'เล่นด้วยเครื่องอะไร?',other:'อื่นๆ',q_extra:'อยากบอกอะไรเพิ่มไหม',optional:'(ไม่บังคับ)',
    honest:'บอกตรงๆ ได้เลย คำติช่วยเราได้มากกว่าคำชม',send:'ส่งคำตอบ',sending:'กำลังส่ง…',need:'กรุณาตอบข้อ 1, 2, 3 และ 6',fail:'ส่งไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วกดอีกครั้ง',
    done_h:'ส่งแล้ว ขอบคุณมาก!',done_p:'บอกคนที่ส่งลิงก์มาได้เลยว่าเสร็จแล้ว',privacy:'เราไม่เก็บชื่อหรือข้อมูลส่วนตัว',again_sent:'ส่งไปแล้ว ถ้าส่งอีกจะบันทึกเป็นคำตอบใหม่'}
};
const P=new URLSearchParams(location.search);
const clean=(v,n)=>String(v||'').trim().replace(/[^\p{L}\p{N}_.-]/gu,'').slice(0,n);
const gameId=GAMES[P.get('g')]?P.get('g'):'curling2048',G=GAMES[gameId];
const tester=clean(P.get('t'),40)||'anon',isTest=P.get('test')==='1';
const sentKey='arinplay.playtest.sent.'+gameId+'.'+tester;
let lang=(()=>{const q=P.get('lang');if(T[q])return q;try{const s=localStorage.getItem('arinplay.playtest.lang');if(T[s])return s}catch(e){}const n=(navigator.language||'').toLowerCase();return n.startsWith('th')?'th':n.startsWith('ko')?'ko':'en'})();
const ans={matches:null,knew_what_to_do:null,got_the_score:null,again:null,device:null};
const $=id=>document.getElementById(id);
function paint(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(t[k]!=null)el.textContent=t[k]});
  $('title').textContent=G.name[lang]||G.name.en;$('q2text').textContent=G.q2[lang]||G.q2.en;$('who').textContent=tester;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  document.title='Arin Play · '+(G.name[lang]||G.name.en);
  let sent=false;try{sent=localStorage.getItem(sentKey)==='1'}catch(e){}
  if(sent&&$('done').hidden)status(t.again_sent,false);
}
function status(msg,err){const s=$('status');s.textContent=msg||'';s.classList.toggle('err',!!err)}
const u=new URL(G.url);u.searchParams.set('utm_source',tester);u.searchParams.set('utm_medium','playtest');u.searchParams.set('utm_campaign','playtest');if(isTest)u.searchParams.set('tester','1');
$('playlink').href=u.toString();
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('arinplay.playtest.lang',lang)}catch(e){}paint()}));
document.querySelectorAll('.chips').forEach(g=>{const f=g.dataset.field,isInt=g.dataset.type==='int';g.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{const v=isInt?Number(b.dataset.v):b.dataset.v;ans[f]=ans[f]===v&&f==='device'?null:v;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String((isInt?Number(x.dataset.v):x.dataset.v)===ans[f])));if(f!=='device')status('',false)})})});
let busy=false;
$('send').addEventListener('click',async()=>{
  const t=T[lang];if(busy)return;
  if(ans.matches==null||!ans.knew_what_to_do||!ans.got_the_score||ans.again==null){status(t.need,true);return}
  const row={game:gameId,tester,lang,matches:ans.matches,device:ans.device,knew_what_to_do:ans.knew_what_to_do,got_the_score:ans.got_the_score,
    best:$('best').value.trim().slice(0,1000)||null,worst:$('worst').value.trim().slice(0,1000)||null,again:ans.again,change_one:$('change_one').value.trim().slice(0,1000)||null,extra:$('extra').value.trim().slice(0,1000)||null,is_test:isTest};
  busy=true;$('send').disabled=true;status(t.sending,false);
  try{
    const r=await fetch(SINK.url,{method:'POST',headers:{apikey:SINK.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});
    if(!r.ok)throw new Error('http '+r.status);
    try{localStorage.setItem(sentKey,'1')}catch(e){}
    $('form').hidden=true;$('playcard').hidden=true;$('bar').hidden=true;$('done').hidden=false;window.scrollTo({top:0});
  }catch(e){status(t.fail,true)}finally{busy=false;$('send').disabled=false}
});
paint();
})();
</script>
</body>
</html>
